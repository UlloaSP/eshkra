name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Daily rebuild so star and download counts stay current.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Check
        run: vp check

      - name: Typecheck Astro files
        run: vp run typecheck

      - name: Build
        run: vp run build
        env:
          # Raises the GitHub API rate limit for star counts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # Retries cover the certificate and edge propagation after a first deploy.
        run: |
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors -m 20 -o page.html https://eshkra.dev/
          grep -q '<title>eshkra' page.html
          curl -fsS -m 20 https://eshkra.dev/sitemap.xml | grep -q '<loc>https://eshkra.dev/</loc>'
          curl -fsS -m 20 https://eshkra.dev/llms.txt | grep -q '^# eshkra'
          # www is a Cloudflare redirect rule, not part of the Worker.
          redirect=$(curl -sS --retry 5 --retry-delay 10 --retry-all-errors -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' 'https://www.eshkra.dev/docs?x=1')
          echo "www: $redirect"
          test "$redirect" = '301 https://eshkra.dev/docs?x=1'
